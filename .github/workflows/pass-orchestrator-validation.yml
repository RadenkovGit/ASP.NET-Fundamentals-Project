name: Pass Orchestrator Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      plan:
        description: "Pass plan path"
        required: true
        type: string
        default: pass-plans/example-docs-pass.json
      head_ref:
        description: "Optional pass branch to validate, e.g. pass/docs-example-v1"
        required: false
        type: string
      base_ref:
        description: "Base branch for optional pass branch validation"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pass plans
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t plans < <(find pass-plans -maxdepth 1 -name '*.json' ! -name '*.schema.json' -print | sort)
          if [ "${#plans[@]}" -eq 0 ]; then
            echo "No pass plans found."
            exit 0
          fi
          python3 scripts/validate_pass_plan.py "${plans[@]}"

      - name: Validate pass branch shape when requested
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          DISPATCH_HEAD_REF: ${{ github.event.inputs.head_ref }}
          DISPATCH_BASE_REF: ${{ github.event.inputs.base_ref }}
          DISPATCH_PLAN: ${{ github.event.inputs.plan }}
        run: |
          set -euo pipefail

          HEAD_REF=""
          BASE_BRANCH=""
          PLAN_INPUT=""

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            HEAD_REF="${DISPATCH_HEAD_REF}"
            BASE_BRANCH="${DISPATCH_BASE_REF:-main}"
            PLAN_INPUT="${DISPATCH_PLAN}"
          elif [ -n "${PR_HEAD_REF}" ] && [[ "${PR_HEAD_REF}" == pass/* ]]; then
            HEAD_REF="${PR_HEAD_REF}"
            BASE_BRANCH="${PR_BASE_REF}"
          fi

          if [ -z "${HEAD_REF}" ]; then
            echo "No pass branch validation requested."
            exit 0
          fi

          if [[ "${HEAD_REF}" != pass/* ]]; then
            echo "head_ref must start with pass/: ${HEAD_REF}" >&2
            exit 1
          fi

          BASE_REF="origin/${BASE_BRANCH}"
          git fetch origin \
            "+${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"

          if [ -z "${PLAN_INPUT}" ]; then
            export HEAD_REF
            PLAN_INPUT="$(python3 - <<'PY'
import json
from pathlib import Path
import os

head_ref = os.environ["HEAD_REF"]
matches = []
for path in sorted(Path("pass-plans").glob("*.json")):
    if path.name.endswith(".schema.json"):
        continue
    with path.open("r", encoding="utf-8") as handle:
        data = json.load(handle)
    if data.get("pass_branch") == head_ref:
        matches.append(str(path))

if len(matches) != 1:
    raise SystemExit(f"Expected exactly one pass plan for {head_ref}, found {len(matches)}: {matches}")

print(matches[0])
PY
)"
          fi

          python3 scripts/validate_pass_branch.py \
            --plan "${PLAN_INPUT}" \
            --base-ref "${BASE_REF}" \
            --head-ref "origin/${HEAD_REF}"
